[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-search-mcp"
version = "0.1.3"
description = "A Model Context Protocol (MCP) server for deep social media search (SearXNG, Serper, Google)."
readme = "README.md"
authors = [
    { name = "Shubham", email = "author@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests",
    "beautifulsoup4",
    "pydantic>=2.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["mcp", "claude", "search", "social-media", "llm", "ai"]

[project.urls]
Homepage = "https://github.com/shubhamekapure/social-search-mcp"
Issues = "https://github.com/shubhamekapure/social-search-mcp/issues"

[project.scripts]
social-search-mcp = "social_search_mcp:main"
